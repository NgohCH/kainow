# Kainow on one computer: PostgreSQL, the API (which also serves the review screen) and the worker.
# Read INSTALL.md first. Everything is bound to this computer only (127.0.0.1); there is no HTTPS here.

x-kainow: &kainow
  build:
    context: ./app
    target: runtime
  image: kainow-app:0.0.0
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
  environment: &kainow-env
    DATABASE_URL: postgres://kainow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}@db:5432/kainow
    NODE_ENV: production

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: kainow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}
      POSTGRES_DB: kainow
    volumes:
      - kainow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kainow -d kainow"]
      interval: 5s
      timeout: 5s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

  # Runs once at every start and applies any new database migrations, then exits.
  migrate:
    <<: *kainow
    restart: "no"
    command: ["node", "dist/db/migrate-cli.js"]
    depends_on:
      db: { condition: service_healthy }

  api:
    <<: *kainow
    command: ["node", "dist/main.js"]
    environment:
      <<: *kainow-env
      PORT: "3000"
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in the .env file (at least 32 characters)}
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOG_SIGN_IN_CODES: ${LOG_SIGN_IN_CODES:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      M365_TENANT_ID: ${M365_TENANT_ID:-}
      M365_CLIENT_ID: ${M365_CLIENT_ID:-}
      M365_CLIENT_SECRET: ${M365_CLIENT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      APP_URL: ${APP_URL:-http://localhost:${KAINOW_PORT:-3000}}
      KAINOW_RELEASE_REPO: ${KAINOW_RELEASE_REPO:-}
      KAINOW_RELEASE_API: ${KAINOW_RELEASE_API:-}
    # Protected key for quarantined credentials (INSTALL.md, "Protected key"). Optional: without it, cleaning waits.
    # Do not edit this file to add it (an update replaces it, and the updater refuses a folder whose tracked files
    # changed). Copy compose.override.example.yaml to compose.override.yaml, which sets on api, worker and ops:
    #   environment:  KAINOW_PROTECTED_KEY_FILE: /run/secrets/kainow-protected.key
    #   volumes:      - ./secrets/kainow-protected.key:/run/secrets/kainow-protected.key:ro
    ports:
      - "127.0.0.1:${KAINOW_PORT:-3000}:3000"
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    <<: *kainow
    command: ["node", "dist/worker/main.js"]
    environment:
      <<: *kainow-env
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      LOG_SIGN_IN_CODES: ${LOG_SIGN_IN_CODES:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      M365_TENANT_ID: ${M365_TENANT_ID:-}
      M365_CLIENT_ID: ${M365_CLIENT_ID:-}
      M365_CLIENT_SECRET: ${M365_CLIENT_SECRET:-}
      APP_URL: ${APP_URL:-http://localhost:${KAINOW_PORT:-3000}}
      KAINOW_RELEASE_REPO: ${KAINOW_RELEASE_REPO:-}
      KAINOW_RELEASE_API: ${KAINOW_RELEASE_API:-}
    # The protected key: the same two lines as on api, in compose.override.yaml; see the note there.
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Backups, the restore drill and the storage check (INSTALL.md, "Backups"). Never starts with `up`: run it with
  #   docker compose --profile ops run --rm ops node dist/ops/<command>-cli.js
  # No depends_on, so a restore can run with only `db` started. No ports. It never sends email, only writes outbox rows.
  ops:
    <<: *kainow
    build:
      context: ./app
      target: ops
    image: kainow-ops:0.0.0
    profiles: [ops]
    restart: "no"
    command: ["node", "-e", "console.log('Run a command: node dist/ops/<name>-cli.js')"]
    environment:
      <<: *kainow-env
      KAINOW_BACKUP_DIR: /backups
      KAINOW_BACKUP_DIR_LABEL: ${KAINOW_BACKUP_DIR:-not set}
      KAINOW_BACKUP_KEY_FILE: /run/secrets/kainow-backup.key
      KAINOW_DB_DATA_DIR: /pgdata
      # Protected key: needed once the protected source area is in use. Set in compose.override.yaml (see the note on api).
    volumes:
      # The folder must be writable by uid 1000 (the node user); INSTALL.md gives the chown line.
      # Unset or missing: only `ops` runs fail (the folder is never created for you); other commands are unaffected.
      - type: bind
        source: ${KAINOW_BACKUP_DIR:-./kainow-backup-folder-not-set}
        target: /backups
        bind: { create_host_path: false }
      # Only measured, to know how full the database disk is.
      - kainow-db:/pgdata:ro
      # The backup key (create with `npm run backup-key -- --create <path>`) and the protected key are mounted by
      # compose.override.yaml (copy compose.override.example.yaml), never by editing this file:
      #   - ./secrets/kainow-backup.key:/run/secrets/kainow-backup.key:ro
      #   - ./secrets/kainow-protected.key:/run/secrets/kainow-protected.key:ro

  # The updater (10b; INSTALL.md, "Updates"). Never starts with `up`: the server's cron starts it every five minutes with
  #   docker compose --profile updater run --rm updater node dist/updater/updater-cli.js tick
  # It installs only an update an Enterprise Administrator approved, signed by the release key. It holds the Docker
  # socket, which is root-equivalent control of this computer: remove its crontab line to turn it off. No ports, no keys,
  # no email settings. It runs as the owner of the Kainow folder, which it sees at the same path as on the host, so the
  # docker compose commands it runs there resolve the same files, project name and .env as yours do.
  # KAINOW_INSTALL_DIR, KAINOW_UID, KAINOW_GID and DOCKER_GID are needed only here (INSTALL.md gives the lines).
  # Unset: only `updater` runs fail, naming the missing setting; other commands are unaffected (as for ops' folder).
  updater:
    build:
      context: ./app
      target: updater
    image: kainow-updater:0.0.0
    profiles: [updater]
    restart: "no"
    read_only: true
    tmpfs: [/tmp, /home/kainow]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    user: "${KAINOW_UID:-KAINOW_UID-not-set}:${KAINOW_GID:-KAINOW_GID-not-set}"
    group_add: ["${DOCKER_GID:-DOCKER_GID-not-set}"]
    command: ["node", "-e", "console.log('Run a command: node dist/updater/updater-cli.js tick')"]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    environment:
      DATABASE_URL: postgres://kainow:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the .env file}@db:5432/kainow
      NODE_ENV: production
      KAINOW_INSTALL_DIR: ${KAINOW_INSTALL_DIR:-/KAINOW_INSTALL_DIR-not-set}
      HOME: /home/kainow
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: ${KAINOW_INSTALL_DIR:-/KAINOW_INSTALL_DIR-not-set}
        target: ${KAINOW_INSTALL_DIR:-/KAINOW_INSTALL_DIR-not-set}
        bind: { create_host_path: false }

  # The notice page after a failed update (10b spec 5.7): one fixed page, status 503, on Kainow's port. Only the updater
  # starts it (`docker compose --profile updater up -d notice`) while api is stopped; `recover` stops it. No socket,
  # no database, no settings.
  notice:
    build:
      context: ./app
      target: updater
    image: kainow-updater:0.0.0
    profiles: [updater]
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["node", "dist/updater/notice-server.js"]
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
    environment:
      NODE_ENV: production
    ports:
      - "127.0.0.1:${KAINOW_PORT:-3000}:3000"

volumes:
  kainow-db:
